<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>Secret Santa Generator</h1>
  </header>

  <main>
    <!-- The organizer fills out this form -->
    <form id="santa-form">

      <!-- 1. Names: collect them however you like (one at a time, a list, etc.) -->
      <h2>Who's playing?</h2>
      <input type="text" id="name-input">
      <button type="button" id="add-button">Add</button>
      <ul id="name-list"></ul>

      <!-- 2. Gift rules: all four are required -->
      <h2>Gift rules</h2>
      <label for="budget">Budget</label>
      <input type="text" id="budget">
      <label for="date">Date</label>
      <input type="date" id="date">
      <label for="time">Time</label>
      <input type="time" id="time">
      <label for="location">Location</label>
      <input type="text" id="location">

      <!-- 3. Generate -->
      <button type="submit" id="generate-button">Generate matches</button>
      <p id="message"></p>
    </form>

    <a href="PASTE YOUR SHEET LINK HERE" target="_blank">View the results sheet</a>
  </main>

  <!-- 4. Popup: your script fills #matches, then opens it.
       Using a separate results page instead? You can delete this popup. -->
  <div class="modal fade" id="matches-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Secret Santa Matches</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="matches"></div>
        <div class="modal-footer">
          <button type="button" id="print-button">Print</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Made by Partner One and Partner Two</p>
  </footer>

</body>
</html>
